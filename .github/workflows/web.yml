# Tests and builds web/, and publishes it to https://ysxiaixsy.github.io/Recursed/
#
# - Each push to main publishes the site (HANDOFF S1).
# - Each push to a stage branch (s1-first-fight, s2-..., and so on) also
#   publishes it, so JP can test a stage on his phone before he merges it.
#   The site shows the last published push.
# - Pull requests run the checks only.
name: web

on:
  push:
    branches: [main, 's[0-9]-*']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Unit tests and parity test
        run: npm test

      - name: Strict type check and build
        run: npm run build

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (390 x 844, touch)
        run: npm run e2e

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: web/test-results/
          if-no-files-found: ignore

      - name: Package the site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
